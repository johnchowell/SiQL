# Lint, test and build the package on every Python version it supports (requires-python in pyproject.toml)
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install the package and test tools
      run: |
        python -m pip install --upgrade pip
        python -m pip install -e . build twine flake8
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 src benchmarks --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 src benchmarks --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with the C extension
      env:
        SIQL_REQUIRE_SPEEDUPS: "1"  # fail instead of quietly falling back if the extension didn't compile
      run: |
        python -m unittest discover -s src/siql/tests -t src -v
    - name: Test the pure-Python fallback
      env:
        SIQL_PURE_PYTHON: "1"
      run: |
        python -m unittest discover -s src/siql/tests -t src
    - name: Build and check the distribution
      run: |
        python -m build
        twine check dist/*
