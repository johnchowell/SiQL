[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "SiQL"
dynamic = ["version"]
description = "A Python API for local tables and data access/searching, much like SQLite"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "johnchowell" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["table", "query", "database", "local storage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/johnchowell/SiQL"
Source = "https://github.com/johnchowell/SiQL"
Issues = "https://github.com/johnchowell/SiQL/issues"

[project.scripts]
siql = "siql.controllers.shell:main"
siql-server = "siql.server.cli:main"

# Development only, not installed with the package: pip install -e . --group dev
[dependency-groups]
dev = ["build>=1.2", "twine>=6.1", "flake8>=7.1", { include-group = "bench" }]
bench = ["matplotlib>=3.10"]

[tool.setuptools.dynamic]
version = { attr = "siql.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["siql.tests", "siql.tests.*"]

# C versions of the search functions. Optional: without a C compiler, siql installs without them and uses the
# Python versions in siql/helpers/search.py
[[tool.setuptools.ext-modules]]
name = "siql._speedups"
sources = ["src/siql/_speedups.c"]
py-limited-api = true
optional = true

# Built against the stable ABI, so one wheel per platform works on Python 3.11 and later
[tool.distutils.bdist_wheel]
py-limited-api = "cp311"
