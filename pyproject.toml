[build-system]
requires = ["setuptools>=77", "Cython>=3.2,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "SiQL"
dynamic = ["version"]
description = "A Python API for local tables and data access/searching, much like SQLite"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "johnchowell" }]
requires-python = ">=3.11"
dependencies = []
keywords = ["table", "query", "database", "local storage"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/johnchowell/SiQL"
Source = "https://github.com/johnchowell/SiQL"
Issues = "https://github.com/johnchowell/SiQL/issues"

[project.scripts]
siql = "siql.controllers.shell:main"
siql-server = "siql.server.cli:main"

# Development only, not installed with the package: pip install -e . --group dev
[dependency-groups]
dev = ["build>=1.2", "twine>=6.1", "flake8>=7.1", { include-group = "bench" }]
bench = ["matplotlib>=3.10"]

[tool.setuptools.dynamic]
version = { attr = "siql.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
exclude = ["siql.tests", "siql.tests.*"]

# setup.py builds every implementation module as a C++ extension, plus the C search engine.
# Wheels target the compiling CPython version and platform.
